name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bootstrap Flutter project if empty
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "No pubspec.yaml — bootstrapping Flutter project..."
            flutter create \
              --org com.oracle \
              --project-name oracle \
              --platforms android \
              --description "Oracle - daily AI prophecy" \
              .
            if ! grep -q "android/local.properties" .gitignore 2>/dev/null; then
              echo "" >> .gitignore
              echo "# Prevent committing local SDK path" >> .gitignore
              echo "android/local.properties" >> .gitignore
            fi
            echo "" >> android/gradle.properties
            echo "android.aapt2FromMavenOverride=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2" >> android/gradle.properties
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'chore: bootstrap Flutter project via CI'
            git push
          fi

      - name: Write local.properties for CI build
        run: |
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: oracle-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
